<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Rastreo GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; background: #f4f6f9; }
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a202c; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .login-card { background: #fff; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 6px; }
    .login-card button { width: 100%; padding: 12px; background: #3182ce; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #login-error { color: #e53e3e; font-size: 13px; margin-top: 10px; display: none; }
    #map-screen { display: none; width: 100%; height: 100vh; }
    #map { width: 100%; height: 100%; }
    #alert-modal { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e53e3e; color: #fff; padding: 15px 25px; border-radius: 8px; z-index: 10000; text-align: center; }
    #alert-modal button { margin-top: 10px; padding: 6px 15px; background: #fff; color: #e53e3e; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h2>Iniciar Sesión</h2>
      <input type="text" id="username" placeholder="Usuario">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="login()">Ingresar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="alert-modal">
    <p id="alert-text"></p>
    <button onclick="dismissAlert()">Aceptar / Verificar</button>
  </div>

  <div id="map-screen">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map = null;
    const markers = {};

    function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      socket.emit('login', { username: u, password: p }, (res) => {
        if (res.success) {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('map-screen').style.display = 'block';
          initMap();
          startTracking();
        } else {
          const err = document.getElementById('login-error');
          err.innerText = res.message;
          err.style.display = 'block';
        }
      });
    }

    function initMap() {
      if (map) return;
      map = L.map('map').setView([19.4326, -99.1332], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function startTracking() {
      if (navigator.geolocation) {
        sendPos();
        setInterval(sendPos, 5000);
      }
    }

    function sendPos() {
      navigator.geolocation.getCurrentPosition((pos) => {
        socket.emit('update-location', { latitude: pos.coords.latitude, longitude: pos.coords.longitude, deviceId: 'MiVehiculo' });
      }, null, { enableHighAccuracy: true });
    }

    socket.on('location-updated', (d) => {
      if (!map) return;
      if (markers[d.id]) markers[d.id].setLatLng([d.latitude, d.longitude]);
      else markers[d.id] = L.marker([d.latitude, d.longitude]).addTo(map);
    });

    socket.on('alert-stopped', (d) => showAlert(d.message));
    socket.on('alert-out-of-bounds', (d) => showAlert(d.message));

    function showAlert(t) {
      document.getElementById('alert-text').innerText = t;
      document.getElementById('alert-modal').style.display = 'block';
    }

    function dismissAlert() {
      document.getElementById('alert-modal').style.display = 'none';
    }
  </script>
</body>
</html>
